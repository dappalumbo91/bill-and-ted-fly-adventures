name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  boot:
    name: Pack boot (fresh clone, no external data)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      # Scope: only what runs from a fresh clone. fetch_data.py, --live, --apis
      # and scripts that need the downloaded connectome feathers / provers are
      # intentionally not run here.
      - name: boot_pack.py
        run: python scripts/boot_pack.py
      - name: boot_pack.py --check
        run: python scripts/boot_pack.py --check
